server {
    listen 80;
    server_name localhost;

    # CORS headers for audio files
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, OPTIONS";

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for JSON and JS
    gzip on;
    gzip_types application/json text/javascript text/css text/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audio files support Range requests
    location /data/audio/ {
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location /dist/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location /data/text/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }
}
